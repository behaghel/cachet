inputs:
  # Pin to stable NixOS release for reliable binary cache hits.
  # Rolling/unstable channels often lack cached binaries, forcing source builds.
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-25.11
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
allowUnfree: true

# SecretSpec integration with dotenv provider
secretspec:
  enable: true
  provider: dotenv
  profile: default
