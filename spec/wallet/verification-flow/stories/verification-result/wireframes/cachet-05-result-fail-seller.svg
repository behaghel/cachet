      <path d="M 200 51 C 234 68, 334 74, 354 77 V 236 C 354 326, 288 397, 200 434 C 112 397, 46 326, 46 236 V 77 C 66 74, 166 68, 200 51 Z" fill="#B87820"/>
      <path d="M 200 59 C 230 69, 328 80, 350 79 V 236 C 350 322, 286 393, 200 430 C 114 393, 50 322, 50 236 V 79 C 72 80, 170 69, 200 59 Z" fill="#D8B468"/>
      <path d="M 200 67 C 228 77, 322 85, 342 88 V 236 C 342 318, 280 386, 200 420 C 120 386, 58 318, 58 236 V 88 C 78 85, 172 77, 200 67 Z" fill="#263347"/>
      <path d="M 200 67 C 172 77, 78 85, 58 88 V 236 C 58 318, 120 386, 200 420 Z" fill="#2D3B52"/>
      <path d="M 200 142 C 280 142, 330 165, 326 278 C 324 347, 268 388, 200 422 Z" fill="#D89420"/>
      <path d="M 200 142 C 120 142, 70 165, 74 278 C 76 347, 132 388, 200 422 Z" fill="#E0A838"/>
      <path d="M 274 334 A 108 117 0 1 0 126 334" fill="none" stroke="#fff" stroke-width="61" stroke-linecap="round"/>
      <g transform="matrix(1.3514, 0, 0, 1.3514, -70.28, -51.0)">
        <line x1="200" y1="192" x2="200" y2="254" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
        <path d="M 218,202 C 210,190 180,192 180,208 C 180,224 220,224 220,240 C 220,256 190,260 182,248" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" opacity="0.9"/>
      </g>
    </symbol>
