  <!-- Phone background -->
  <rect width="375" height="812" rx="40" fill="#0F172A"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>
  <circle cx="320" cy="48" r="4" fill="#10B981"/>
  <rect x="332" y="44" width="20" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Close -->
  <text x="350" y="95" font-family="Inter, sans-serif" font-size="16" fill="#64748B">&#x2715;</text>

  <!-- Result: Incomplete — seller shield with forbidden sign overlay -->
  <use href="#seller-shield" x="128" y="120" width="120" height="156"/>

  <!-- Forbidden sign centered over shield -->
  <circle cx="188" cy="198" r="52" fill="none" stroke="#B91C1C" stroke-width="12"/>
  <line x1="151" y1="161" x2="225" y2="235" stroke="#B91C1C" stroke-width="12" stroke-linecap="round"/>

  <!-- Result text -->
  <text x="188" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Incomplete</text>

  <rect x="108" y="315" width="160" height="28" rx="14" fill="#4C1D1D"/>
  <text x="188" y="334" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FCA5A5">2 of 4 proofs passed</text>

  <!-- What was proven -->
  <text x="188" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Verified just now</text>

  <rect x="24" y="400" width="327" height="220" rx="16" fill="#1E293B"/>

  <!-- Passed -->
  <text x="48" y="430" font-family="Inter, sans-serif" font-size="13" fill="#10B981">&#x2713;</text>
  <text x="68" y="430" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Your identity is verified</text>

  <text x="48" y="460" font-family="Inter, sans-serif" font-size="13" fill="#10B981">&#x2713;</text>
  <text x="68" y="460" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Platform history available</text>

  <!-- Failed -->
  <text x="48" y="498" font-family="Inter, sans-serif" font-size="13" fill="#F97068">&#x2717;</text>
  <text x="68" y="498" font-family="Inter, sans-serif" font-size="13" fill="#F97068">Fulfilment rate above 95%</text>
  <text x="68" y="516" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Credential not available</text>

  <text x="48" y="550" font-family="Inter, sans-serif" font-size="13" fill="#F97068">&#x2717;</text>
  <text x="68" y="550" font-family="Inter, sans-serif" font-size="13" fill="#F97068">Low chargeback rate</text>
  <text x="68" y="568" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Credential not available</text>

  <!-- Metadata -->
  <line x1="48" y1="586" x2="327" y2="586" stroke="#334155" stroke-width="1"/>
  <text x="48" y="608" font-family="Inter, sans-serif" font-size="11" fill="#64748B">No cachet issued</text>
  <text x="300" y="608" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#64748B">All proofs required</text>

  <!-- Receipt -->
  <rect x="24" y="636" width="327" height="44" rx="12" fill="#022C22"/>
  <text x="48" y="662" font-family="Inter, sans-serif" font-size="12" fill="#34D399">&#x2713;  Consent receipt logged</text>
  <text x="312" y="662" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#64748B">View</text>

  <!-- Done -->
  <rect x="24" y="688" width="327" height="48" rx="24" fill="#FFFFFF"/>
  <text x="188" y="718" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Done</text>
</svg>
