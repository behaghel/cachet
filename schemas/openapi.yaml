---
openapi: 3.0.3
info:
  title: Cachet Trust Provider API
  description: |
    OpenAPI specification for Cachet trust provider services.
    This schema is the single source of truth for all service contracts.
    Per-service specs are derived mechanically via tags.
  version: 1.1.0
  contact:
    name: Cachet Team
    url: https://cachet.id
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8090
    description: Issuance Gateway (local)
  - url: http://localhost:8081
    description: Verifier (local)
  - url: http://localhost:8082
    description: Registry (local)
  - url: http://localhost:8083
    description: Receipts Log (local)

tags:
  - name: issuance-gateway
    description: OpenID4VCI credential issuance and Veriff integration
  - name: verifier
    description: Trust Pack verification
  - name: registry
    description: Policy and pack registry
  - name: receipts-log
    description: Consent receipts and transparency log

paths:
  # ── Issuance Gateway ──────────────────────────────────────────────

  /oauth/token:
    post:
      summary: Request OAuth2 access token
      description: OAuth2 client credentials flow per RFC 6749
      operationId: requestToken
      tags: [issuance-gateway]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Access token issued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /credential:
    post:
      summary: Request verifiable credential
      description: Issue a verifiable credential using OpenID4VCI protocol
      operationId: requestCredential
      tags: [issuance-gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRequest"
      responses:
        "200":
          description: Credential issued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialResponse"
        "401":
          description: Invalid or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Invalid credential request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhooks/veriff:
    post:
      summary: Veriff webhook endpoint
      description: Receives verification status updates from Veriff
      operationId: handleVeriffWebhook
      tags: [issuance-gateway]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VeriffSession"
      responses:
        "200":
          description: Webhook processed — session approved and stored
        "202":
          description: >-
            Webhook acknowledged — session not approved
            or failed quality validation

  /status/{listId}:
    get:
      summary: Get StatusList2021 credential
      description: >-
        Returns a StatusList2021Credential containing the revocation
        bitstring for the given list
      operationId: getStatusList
      tags: [issuance-gateway]
      security: []
      parameters:
        - name: listId
          in: path
          required: true
          description: Status list identifier
          schema:
            type: string
      responses:
        "200":
          description: StatusList2021 bitstring credential
          headers:
            Cache-Control:
              description: Caching directive for the status list
              schema:
                type: string
                example: "max-age=300"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusList2021Credential"

  /status/{listId}/revoke:
    post:
      summary: Revoke a credential by index
      description: Sets the bit at the given index in the status list bitstring
      operationId: revokeCredential
      tags: [issuance-gateway]
      security: []
      parameters:
        - name: listId
          in: path
          required: true
          description: Status list identifier
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "200":
          description: Credential revoked successfully
        "400":
          description: Invalid index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /.well-known/jwks.json:
    get:
      summary: Issuer JWKS endpoint
      description: Returns the issuer's ECDSA public key set as a JWKS document
      operationId: getIssuerJwks
      tags: [issuance-gateway]
      security: []
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"

  # ── Verifier ───────────────────────────────────────────────────────

  /sessions:
    post:
      summary: Create a verification session
      description: Creates a time-bound, one-time-use verification session
      operationId: createSession
      tags: [verifier]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /.well-known/did.json:
    get:
      summary: Verifier DID document
      description: >-
        Serves the verifier's DID document for Request Object
        verification (JsonWebKey2020 verification method)
      operationId: getVerifierDid
      tags: [verifier]
      security: []
      responses:
        "200":
          description: DID document
          content:
            application/json:
              schema:
                type: object
                description: >-
                  W3C DID document. Structure follows the DID Core
                  specification with JsonWebKey2020 verification methods.
                properties:
                  id:
                    type: string
                    description: DID identifier
                    example: "did:web:cachet.id"
                  verificationMethod:
                    type: array
                    description: Verification methods for this DID
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        "404":
          description: No IdentitySigner configured

  /packs:
    get:
      summary: List available Trust Packs
      description: Returns all registered Trust Pack definitions
      operationId: listPacks
      tags: [verifier]
      security: []
      responses:
        "200":
          description: List of available Trust Packs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pack"

  /presentations/verify:
    post:
      summary: Verify a credential presentation
      description: Verifies a credential bundle against a registered policy
      operationId: verifyPresentation
      tags: [verifier]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Registry ───────────────────────────────────────────────────────

  /policy/manifest:
    get:
      summary: Get policy manifest
      description: Returns the signed policy manifest in YAML format
      operationId: getPolicyManifest
      tags: [registry]
      security: []
      responses:
        "200":
          description: Policy manifest
          content:
            text/yaml:
              schema:
                type: string
                description: |
                  YAML document with fields: id, version, issuedAt, signingDid.
                  Example:
                    id: policy.cachet.manifest
                    version: 0.1.0
                    issuedAt: 2025-08-31T00:00:00Z
                    signingDid: did:web:cachet.id#keys-1

  /registry/packs:
    get:
      summary: List available Trust Pack definitions
      description: Returns all registered Trust Pack definitions with metadata
      operationId: listPackDefinitions
      tags: [registry]
      security: []
      responses:
        "200":
          description: List of pack definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PackDefinition"

  /registry/packs/{packId}:
    get:
      summary: Get a specific Trust Pack definition
      description: Returns the full pack definition including predicates
      operationId: getPackDefinition
      tags: [registry]
      security: []
      parameters:
        - name: packId
          in: path
          required: true
          description: Pack identifier (e.g., pack.childcare.readiness.es)
          schema:
            type: string
      responses:
        "200":
          description: Pack definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PackDefinition"
        "404":
          description: Pack not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Receipts Log ───────────────────────────────────────────────────

  /receipts/hash:
    post:
      summary: Submit consent receipt hash
      description: Submits a salted hash of a consent receipt for anchoring
      operationId: submitReceiptHash
      tags: [receipts-log]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptHashRequest"
      responses:
        "200":
          description: Receipt hash accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptHashResponse"

  /log/sth:
    get:
      summary: Get signed tree head
      description: Returns the current signed tree head of the transparency log
      operationId: getSignedTreeHead
      tags: [receipts-log]
      security: []
      responses:
        "200":
          description: Current signed tree head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedTreeHead"

  /log/proof:
    get:
      summary: Get inclusion proof
      description: Returns an inclusion proof for a receipt hash
      operationId: getInclusionProof
      tags: [receipts-log]
      security: []
      parameters:
        - name: hash
          in: query
          description: Receipt hash to prove inclusion for
          schema:
            type: string
      responses:
        "200":
          description: Inclusion proof result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InclusionProof"

  # ── Health (all services) ──────────────────────────────────────────

  /health:
    get:
      summary: Health check endpoint
      description: >-
        Returns service health status.
        All services expose this endpoint.
      operationId: healthCheck
      tags: [issuance-gateway, verifier, registry, receipts-log]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: "ok"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── OAuth2 / OpenID4VCI ────────────────────────────────────────

    TokenRequest:
      type: object
      description: OAuth2 client credentials request per RFC 6749
      required: [grant_type, client_id, scope]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: OAuth2 grant type
        client_id:
          type: string
          description: Client identifier
          example: "cachet-android-wallet"
        scope:
          type: string
          description: Requested scope
          example: "credential_issuance"

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Token expiration time in seconds
          example: 3600
        scope:
          type: string
          description: Granted scope

    CredentialRequest:
      type: object
      required: [format, types]
      properties:
        format:
          type: string
          description: Credential format
          enum: [jwt_vc, vc+sd-jwt, ldp_vc]
          example: "jwt_vc"
        types:
          type: array
          items:
            type: string
          description: Credential types
          example: ["VerifiableCredential", "IdentityCredential"]
        proof:
          type: object
          description: Cryptographic proof (optional)
          additionalProperties: true

    CredentialResponse:
      type: object
      required: [credential, format]
      properties:
        credential:
          $ref: "#/components/schemas/VerifiableCredential"
        format:
          type: string
          description: Credential format used
          example: "jwt_vc"

    # ── W3C Verifiable Credentials ─────────────────────────────────

    VerifiableCredential:
      type: object
      required: [id, "@context", type, issuer, issuanceDate, credentialSubject]
      properties:
        id:
          type: string
          description: Unique credential identifier
          pattern: >-
            ^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-
            [0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        "@context":
          type: array
          items:
            type: string
          minItems: 1
          example:
            - "https://www.w3.org/2018/credentials/v1"
            - "https://cachet.id/contexts/identity/v1"
        type:
          type: array
          items:
            type: string
          minItems: 1
          example: ["VerifiableCredential", "IdentityCredential"]
        issuer:
          type: string
          description: Credential issuer DID
          pattern: "^did:"
          example: "did:veriff:production"
        issuanceDate:
          type: string
          format: date-time
        expirationDate:
          type: string
          format: date-time
          nullable: true
        credentialSubject:
          $ref: "#/components/schemas/CredentialSubject"
        credentialStatus:
          $ref: "#/components/schemas/CredentialStatus"

    CredentialSubject:
      type: object
      description: Claims about the credential subject
      required: [id]
      properties:
        id:
          type: string
          description: Subject DID
          example: "did:example:holder"
        personalData:
          type: object
          description: Personal data (selective disclosure ready)
          properties:
            age:
              type: integer
              description: Subject's age in years
            nationality:
              type: string
              description: ISO country code
            documentType:
              type: string
              description: Type of identity document
        verificationLevel:
          type: string
          description: Level of verification achieved
          enum: [basic, standard, premium, gold]
        verified:
          type: boolean
          description: Whether identity is verified
        verificationMethod:
          type: string
          description: Verification method used
          example: "veriff"
        verificationMetrics:
          type: object
          description: Quality metrics from verification
          properties:
            overallConfidence:
              type: number
              format: double
            livenessScore:
              type: number
              format: double
            documentAuthenticity:
              type: number
              format: double
            riskScore:
              type: number
              format: double
            sessionTimestamp:
              type: string
              format: date-time
        evidence:
          type: array
          description: Verification evidence for audit trail
          items:
            type: object
            properties:
              type:
                type: string
              sessionId:
                type: string
              verifier:
                type: string
              status:
                type: string
      additionalProperties: true

    CredentialStatus:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          format: uri
          description: Status list entry URI
        type:
          type: string
          enum: [StatusList2021Entry]

    # ── Veriff Integration ─────────────────────────────────────────

    VeriffSession:
      type: object
      required: [session_id, status]
      properties:
        session_id:
          type: string
          description: Veriff session identifier
          example: "veriff-session-1234567890"
        status:
          type: string
          enum: [approved, declined, expired, abandoned]
        person:
          type: object
          properties:
            firstName:
              type: string
            lastName:
              type: string
            dateOfBirth:
              type: string
              format: date
            confidence:
              type: number
              format: double
              description: Person identity confidence score
        document:
          type: object
          properties:
            number:
              type: string
            type:
              type: string
              enum: [passport, driver_license, national_id]
            country:
              type: string
              description: ISO country code
              pattern: "^[A-Z]{2}$"
            authenticity:
              type: number
              format: double
              description: Document authenticity score
        verification:
          type: object
          description: Verification quality metrics
          properties:
            livenessScore:
              type: number
              format: double
              description: Liveness check score (0.0-1.0)
            overallConfidence:
              type: number
              format: double
              description: Overall verification confidence (0.0-1.0)
            riskScore:
              type: number
              format: double
              description: Risk score (0.0-1.0, higher is riskier)
            timestamp:
              type: string
              format: date-time
              description: When verification was performed

    # ── StatusList / Revocation ───────────────────────────────────

    StatusList2021Credential:
      type: object
      description: >-
        W3C Verifiable Credential containing a StatusList2021
        revocation bitstring
      properties:
        "@context":
          type: array
          items:
            type: string
          example:
            - "https://www.w3.org/2018/credentials/v1"
            - "https://w3id.org/vc/status-list/2021/v1"
        id:
          type: string
          format: uri
          description: Status list credential URI
        type:
          type: array
          items:
            type: string
          example: ["VerifiableCredential", "StatusList2021Credential"]
        issuer:
          type: string
          description: Issuer DID
        issuanceDate:
          type: string
          format: date-time
        credentialSubject:
          type: object
          properties:
            id:
              type: string
              format: uri
            type:
              type: string
              enum: [StatusList2021]
            statusPurpose:
              type: string
              enum: [revocation]
            encodedList:
              type: string
              description: GZIP-compressed, base64-encoded bitstring
      additionalProperties: true

    RevokeRequest:
      type: object
      required: [index]
      properties:
        index:
          type: integer
          description: Bit position in the status list to set (revoke)
          example: 42

    # ── Issuer JWKS ────────────────────────────────────────────────

    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: Array of JSON Web Key objects
          items:
            type: object
            description: JWK object (RFC 7517)
            properties:
              kty:
                type: string
                description: Key type
                example: "EC"
              crv:
                type: string
                description: Elliptic curve
                example: "P-256"
              x:
                type: string
                description: X coordinate (base64url)
              y:
                type: string
                description: Y coordinate (base64url)
              kid:
                type: string
                description: Key identifier
              use:
                type: string
                description: Key usage
                example: "sig"
              alg:
                type: string
                description: Algorithm
                example: "ES256"
            additionalProperties: true

    # ── Verifier ───────────────────────────────────────────────────

    SessionRequest:
      type: object
      description: Optional parameters for session creation
      properties:
        packId:
          type: string
          description: Pack identifier to scope the session
          example: "pack.childcare.readiness.es"
        question:
          type: string
          description: Verification question to display
          example: "Are you childcare-ready in Spain?"
        predicates:
          type: array
          items:
            type: string
          description: Predicate IDs to evaluate
          example: ["age.ge.18", "identity.verified"]

    SessionResponse:
      type: object
      required: [sessionId, nonce, verifierDid]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Unique session identifier (UUID v4)
        nonce:
          type: string
          description: Cryptographically random nonce (base64url-encoded)
        verifierDid:
          type: string
          description: Verifier's DID
          example: "did:web:cachet.id"
        ephemeralPubKey:
          type: string
          nullable: true
          description: >-
            X25519 ephemeral public key for E2E encryption
            (base64url-encoded, null if key generation failed)
        requestObject:
          type: string
          nullable: true
          description: >-
            Signed JWT Request Object
            (null if no IdentitySigner configured)

    Pack:
      type: object
      required: [id, version, name]
      properties:
        id:
          type: string
          description: Pack identifier
          example: "pack.childcare.readiness.es"
        version:
          type: string
          description: Semantic version
          example: "0.1.0"
        name:
          type: string
          description: Human-readable pack name
          example: "Childcare Readiness (Spain)"

    VerifyRequest:
      type: object
      required: [policyId, bundle]
      properties:
        policyId:
          type: string
          description: Pack identifier to verify against
          example: "pack.childcare.readiness.es"
        bundle:
          type: object
          description: Credential presentation bundle
          required: [credentials]
          properties:
            credentials:
              type: array
              description: Verifiable credentials to evaluate
              items:
                $ref: "#/components/schemas/VerifiableCredential"

    VerifyResponse:
      type: object
      required: [cachet, predicates, freshness, predicateResults, summary]
      properties:
        cachet:
          type: string
          description: Cachet label if granted, empty string otherwise
          example: "Childcare‑Ready (ES)"
        predicates:
          type: array
          items:
            type: string
          description: Predicate IDs that were satisfied
          example: ["age.ge.18", "identity.verified"]
        freshness:
          type: string
          description: Freshness status of the credentials
          enum: [ok, stale, expired]
        predicateResults:
          type: array
          description: Per-predicate evaluation results
          items:
            $ref: "#/components/schemas/PredicateResult"
        summary:
          $ref: "#/components/schemas/VerificationSummary"

    PredicateResult:
      type: object
      required: [predicateId, status]
      properties:
        predicateId:
          type: string
          description: Predicate identifier from the pack definition
          example: "age.ge.18"
        status:
          type: string
          description: Evaluation outcome
          enum: [satisfied, failed, not_evaluable, no_credential]
        reason:
          type: string
          description: Human-readable reason (for non-satisfied statuses)
          example: "proof type vc-bbs not yet supported"

    VerificationSummary:
      type: object
      required: [requiredSatisfied, requiredTotal, cachetGranted]
      properties:
        requiredSatisfied:
          type: integer
          description: Number of required predicates that were satisfied
        requiredTotal:
          type: integer
          description: Total number of required predicates
        optionalSatisfied:
          type: integer
          description: Number of optional predicates that were satisfied
        optionalTotal:
          type: integer
          description: Total number of optional predicates
        cachetGranted:
          type: boolean
          description: Whether the badge was granted (all required predicates satisfied)

    # ── Registry Pack Definitions ──────────────────────────────────

    PackDefinition:
      type: object
      required: [id, version, name, purpose, predicates, badge]
      properties:
        id:
          type: string
          description: Pack identifier
          example: "pack.childcare.readiness.es"
        version:
          type: string
          description: Semantic version
          example: "0.1.0"
        name:
          type: string
          description: Human-readable pack name
          example: "Childcare Readiness (Spain)"
        purpose:
          type: string
          description: Purpose of the pack
          example: "Assess suitability for paid childcare work in private homes"
        jurisdictions:
          type: array
          items:
            type: string
          description: Applicable jurisdictions (ISO country codes)
          example: ["ES"]
        cachet:
          $ref: "#/components/schemas/BadgeDefinition"
        predicates:
          type: array
          items:
            $ref: "#/components/schemas/PredicateDefinition"

    BadgeDefinition:
      type: object
      required: [label, ttl]
      properties:
        label:
          type: string
          description: Badge display label
          example: "Childcare‑Ready (ES)"
        ttl:
          type: string
          description: Badge time-to-live (ISO 8601 duration)
          example: "P90D"
        jurisdiction:
          type: string
          description: Badge jurisdiction
          example: "ES"

    PredicateDefinition:
      type: object
      required: [id, claim, operator, value, issuersAccepted, proofType]
      properties:
        id:
          type: string
          description: Predicate identifier
          example: "age.ge.18"
        claim:
          type: string
          description: Claim field name in the credential subject
          example: "age"
        operator:
          type: string
          description: Comparison operator
          enum: [">=", ">", "<=", "<", "==", "boolean"]
        value:
          description: Expected value (type depends on operator)
        issuersAccepted:
          type: array
          items:
            type: string
          description: DID patterns of accepted issuers (supports * wildcard)
          example: ["did:veriff:*"]
        proofType:
          type: string
          description: Required proof type
          enum: [sd-jwt, vc-bbs, zk-snark]
        required:
          type: boolean
          description: Whether this predicate is required for badge granting
          default: true

    # ── Receipts Log ───────────────────────────────────────────────

    ReceiptHashRequest:
      type: object
      required: [receiptHash]
      properties:
        receiptHash:
          type: string
          description: SHA-256 hash of the consent receipt

    ReceiptHashResponse:
      type: object
      properties:
        accepted:
          type: boolean
        hash:
          type: string
        anchored:
          type: boolean

    SignedTreeHead:
      type: object
      properties:
        treeSize:
          type: integer
        rootHash:
          type: string
        timestamp:
          type: string
          format: date-time

    InclusionProof:
      type: object
      properties:
        included:
          type: boolean

    # ── Error ──────────────────────────────────────────────────────

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Error code
          example: "invalid_request"
        message:
          type: string
          description: Human-readable error description
        details:
          type: object
          description: Additional error details
          additionalProperties: true
