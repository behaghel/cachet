<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    ONBOARDING 2/3: "Cachets, not data breaches"
    Explains the Cach'Pack / Cachet concept in human terms.
  -->

  <rect width="375" height="812" rx="40" fill="#1E293B"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>

  <!-- Skip -->
  <text x="338" y="95" text-anchor="end" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Skip</text>

  <!-- Illustration: three cachet cards fanned -->
  <!-- Card 3 (back) -->
  <rect x="72" y="160" width="230" height="140" rx="16" fill="#334155" transform="rotate(-6 188 230)"/>
  <!-- Card 2 (mid) -->
  <rect x="72" y="170" width="230" height="140" rx="16" fill="#064E3B" transform="rotate(2 188 240)"/>
  <!-- Card 1 (front) -->
  <rect x="72" y="180" width="230" height="140" rx="16" fill="#10B981"/>
  <text x="96" y="214" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Childcare Ready</text>
  <text x="96" y="234" font-family="Inter, sans-serif" font-size="12" fill="#D1FAE5">Valid 90 days</text>
  <!-- Mini predicate list -->
  <text x="96" y="264" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.8">✓ Age 18+</text>
  <text x="96" y="282" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.8">✓ Identity verified</text>
  <text x="96" y="300" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF" opacity="0.8">✓ Background clear</text>

  <!-- Text -->
  <text x="188" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Cachets, not</text>
  <text x="188" y="435" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">data breaches</text>

  <text x="188" y="478" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">Cachets prove specific things —</text>
  <text x="188" y="498" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">"I'm 18+", not your whole identity.</text>
  <text x="188" y="518" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">Reuse them everywhere.</text>

  <!-- Key point -->
  <rect x="40" y="550" width="295" height="56" rx="16" fill="#334155"/>
  <text x="64" y="574" font-family="Inter, sans-serif" font-size="20" fill="#10B981">♻️</text>
  <text x="92" y="572" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Cache once, prove many times.</text>
  <text x="92" y="590" font-family="Inter, sans-serif" font-size="12" fill="#64748B">No repeated ID checks.</text>

  <!-- Pagination dots -->
  <circle cx="172" cy="650" r="4" fill="#64748B"/>
  <circle cx="188" cy="650" r="4" fill="#FFFFFF"/>
  <circle cx="204" cy="650" r="4" fill="#64748B"/>

  <!-- CTA -->
  <rect x="24" y="700" width="327" height="56" rx="28" fill="#10B981"/>
  <text x="188" y="734" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Next</text>
</svg>