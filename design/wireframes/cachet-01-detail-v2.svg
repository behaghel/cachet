<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    CACHET DETAIL v2: Tap a cachet from My Cachets vault.
    Integrates the tier dial from TrustTrail wireframes.
    Shows: C-dial with cachet logo, tier badge, strength %,
    cachet name, predicates, evidence breakdown, secondary CTA.
    Example: Silver Trusted Host, 72% strength.
  -->

  <defs>
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="60%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>

  <rect width="375" height="812" rx="40" fill="#FAFAF9"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1C1917">9:41</text>
  <circle cx="320" cy="48" r="4" fill="#10B981"/>
  <rect x="332" y="44" width="20" height="8" rx="2" fill="#1C1917"/>

  <!-- Back arrow -->
  <text x="24" y="95" font-family="Inter, sans-serif" font-size="22" fill="#1C1917">&#x2039;</text>

  <!-- ═══ HERO: C-DIAL WITH CACHET LOGO ═══ -->
  <g transform="translate(187, 190)">

    <!-- Background track — full C arc -->
    <path d="M -95 88 A 130 130 0 1 1 95 88"
          fill="none" stroke="#E7E5E4" stroke-width="32" stroke-linecap="round"/>

    <!-- Green progress fill (72%) -->
    <path d="M -95 88 A 130 130 0 1 1 109 -73"
          fill="none" stroke="#10B981" stroke-width="28" stroke-linecap="round"/>

    <!-- Current position dot -->
    <circle cx="109" cy="-73" r="7" fill="#10B981" stroke="white" stroke-width="2.5"/>

    <!-- Unfilled remainder — subtle -->
    <path d="M 109 -73 A 130 130 0 0 1 95 88"
          fill="none" stroke="#D6D3D1" stroke-width="28" stroke-linecap="round" opacity="0.3"/>

    <!-- Cachet logo inside dial (scale 0.3) -->
    <g transform="translate(-60, -78) scale(0.3)">
      <!-- Shield border -->
      <path d="M 200 32 C 240 55, 348 58, 366 59 V 221 C 366 311, 296 382, 200 418 C 104 382, 34 311, 34 221 V 59 C 52 58, 160 55, 200 32 Z" fill="#34D399"/>
      <path d="M 200 40 C 238 54, 340 63, 362 63 V 219 C 362 307, 294 376, 200 412 C 106 376, 38 307, 38 219 V 63 C 60 63, 162 54, 200 40 Z" fill="#10B981"/>
      <path d="M 200 47 C 234 63, 334 68, 354 71 V 218 C 354 301, 288 367, 200 401 C 112 367, 46 301, 46 218 V 71 C 66 68, 166 63, 200 47 Z" fill="#059669"/>
      <path d="M 200 54 C 230 64, 328 74, 350 73 V 218 C 350 297, 286 363, 200 397 C 114 363, 50 297, 50 218 V 73 C 72 74, 170 64, 200 54 Z" fill="#6EE7B7"/>
      <!-- Shield body -->
      <path d="M 200 62 C 228 71, 322 78, 342 81 V 218 C 342 294, 280 356, 200 388 C 120 356, 58 294, 58 218 V 81 C 78 78, 172 71, 200 62 Z" fill="#1E293B"/>
      <path d="M 200 62 C 172 71, 78 78, 58 81 V 218 C 58 294, 120 356, 200 388 Z" fill="#253347"/>
      <!-- Front face -->
      <path d="M 200 131 C 280 131, 330 152, 326 257 C 324 320, 268 358, 200 390 Z" fill="#0EA572"/>
      <path d="M 200 131 C 120 131, 70 152, 74 257 C 76 320, 132 358, 200 390 Z" fill="#10B981"/>
      <!-- White C -->
      <path d="M 274 308 A 108 108 0 1 0 126 308" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Tier badge — inside dial area, below cachet -->
  <rect x="131" y="248" width="112" height="30" rx="15" fill="url(#silver-gradient)"/>
  <rect x="133" y="250" width="108" height="26" rx="13" fill="#FAFAF9"/>
  <text x="187" y="269" text-anchor="middle" fill="#71717A" font-family="Inter, sans-serif" font-size="13" font-weight="800" letter-spacing="1.5">SILVER</text>

  <!-- Strength % -->
  <text x="187" y="298" text-anchor="middle" fill="#78716C" font-family="Inter, sans-serif" font-size="20" font-weight="600">72%</text>

  <!-- Cachet name -->
  <text x="187" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Trusted Host</text>

  <!-- Metadata row -->
  <g transform="translate(0, 350)">
    <text x="60" y="0" font-family="Inter, sans-serif" font-size="12" fill="#A8A29E">Issued</text>
    <text x="60" y="16" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1C1917">Mar 15, 2026</text>
    <text x="187" y="0" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#A8A29E">Issuer</text>
    <text x="187" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#1C1917">Cachet</text>
    <text x="315" y="0" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#A8A29E">Foundation</text>
    <text x="315" y="16" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#10B981">Identity &#x2713;</text>
  </g>

  <!-- ═══ WHAT THIS PROVES ═══ -->
  <line x1="24" y1="388" x2="351" y2="388" stroke="#E7E5E4" stroke-width="1"/>
  <text x="24" y="414" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1C1917">What this proves</text>

  <rect x="16" y="426" width="343" height="120" rx="16" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>

  <!-- Predicate 1 -->
  <text x="40" y="457" font-family="Inter, sans-serif" font-size="14" fill="#10B981">&#x2713;</text>
  <text x="60" y="457" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">Verified hosting track record</text>
  <text x="60" y="473" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">Based on confirmed exchanges, not reviews</text>

  <line x1="40" y1="485" x2="340" y2="485" stroke="#F5F5F4" stroke-width="1"/>

  <!-- Predicate 2 -->
  <text x="40" y="509" font-family="Inter, sans-serif" font-size="14" fill="#10B981">&#x2713;</text>
  <text x="60" y="509" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">Identity verified</text>
  <text x="60" y="525" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">Linked to a Gold identity cachet</text>

  <!-- ═══ EVIDENCE BREAKDOWN ═══ -->
  <line x1="24" y1="558" x2="351" y2="558" stroke="#E7E5E4" stroke-width="1"/>
  <text x="24" y="584" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1C1917">Evidence</text>

  <!-- Platform: HomeExchange -->
  <rect x="16" y="596" width="343" height="52" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="40" y="620" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#1C1917">HomeExchange</text>
  <text x="40" y="638" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">7 evidence items</text>
  <text x="220" y="628" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">72%</text>
  <rect x="228" y="621" width="112" height="6" rx="3" fill="#E7E5E4"/>
  <rect x="228" y="621" width="81" height="6" rx="3" fill="#10B981"/>

  <!-- Platform: Vinted -->
  <rect x="16" y="656" width="343" height="52" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>
  <text x="40" y="680" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#1C1917">Vinted</text>
  <text x="40" y="698" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">3 evidence items</text>
  <text x="220" y="688" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">18%</text>
  <rect x="228" y="681" width="112" height="6" rx="3" fill="#E7E5E4"/>
  <rect x="228" y="681" width="20" height="6" rx="3" fill="#10B981"/>

  <!-- ═══ SECONDARY CTA — outlined SealButton ═══ -->
  <rect x="24" y="732" width="327" height="44" rx="22" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="187" y="759" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#10B981">Scan for more evidence to reach Gold</text>

</svg>
