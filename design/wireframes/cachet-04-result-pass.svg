<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    SCREEN 4: Cachet Result
    Back on the VERIFIER's phone. The person scanned, consented, proofs verified.
    Full-screen celebration: the cachet. Unambiguous, satisfying.
  -->

  <!-- Phone background — dark for drama -->
  <rect width="375" height="812" rx="40" fill="#0F172A"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>
  <circle cx="320" cy="48" r="4" fill="#10B981"/>
  <rect x="332" y="44" width="20" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Close -->
  <text x="350" y="95" font-family="Inter, sans-serif" font-size="16" fill="#64748B">✕</text>

  <!-- ═══ CELEBRATION: BIG CACHET ═══ -->

  <!-- Outer glow ring -->
  <circle cx="188" cy="260" r="110" fill="none" stroke="#10B981" stroke-width="1" opacity="0.15"/>
  <circle cx="188" cy="260" r="95" fill="none" stroke="#10B981" stroke-width="1" opacity="0.25"/>

  <!-- Cachet circle -->
  <circle cx="188" cy="260" r="80" fill="#10B981"/>

  <!-- Checkmark -->
  <path d="M 155 260 L 178 283 L 222 238"
        fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Result text -->
  <text x="188" y="385" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Childcare Ready</text>

  <rect x="128" y="400" width="120" height="28" rx="14" fill="#064E3B"/>
  <text x="188" y="419" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#34D399">All 4 proofs passed</text>

  <!-- ═══ WHAT WAS PROVEN ═══ -->
  <text x="188" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#64748B">Verified just now</text>

  <rect x="24" y="490" width="327" height="180" rx="16" fill="#1E293B"/>

  <!-- Predicate results -->
  <text x="48" y="520" font-family="Inter, sans-serif" font-size="13" fill="#10B981">✓</text>
  <text x="68" y="520" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Age 18 or older</text>

  <text x="48" y="550" font-family="Inter, sans-serif" font-size="13" fill="#10B981">✓</text>
  <text x="68" y="550" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Identity verified</text>

  <text x="48" y="580" font-family="Inter, sans-serif" font-size="13" fill="#10B981">✓</text>
  <text x="68" y="580" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">No criminal record</text>

  <text x="48" y="610" font-family="Inter, sans-serif" font-size="13" fill="#10B981">✓</text>
  <text x="68" y="610" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">2+ verified references</text>

  <!-- Trust metadata -->
  <line x1="48" y1="632" x2="327" y2="632" stroke="#334155" stroke-width="1"/>
  <text x="48" y="654" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Cachet valid for</text>
  <text x="300" y="654" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#A8A29E">90 days</text>

  <!-- ═══ RECEIPT CONFIRMATION ═══ -->
  <rect x="24" y="690" width="327" height="44" rx="12" fill="#022C22"/>
  <text x="48" y="716" font-family="Inter, sans-serif" font-size="12" fill="#34D399">✓  Consent receipt logged</text>
  <text x="312" y="716" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#64748B">View</text>

  <!-- Done button -->
  <rect x="24" y="748" width="327" height="48" rx="24" fill="#FFFFFF"/>
  <text x="188" y="778" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#1E293B">Done</text>
</svg>