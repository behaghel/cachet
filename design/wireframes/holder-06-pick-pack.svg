  <rect x="104" y="508" width="56" height="22" rx="11" fill="#F5F5F4"/>
  <text x="132" y="523" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">Age 18+</text>
  <text x="104" y="550" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">1 proof required</text>
