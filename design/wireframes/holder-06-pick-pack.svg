  <text x="132" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">Age 18+</text>
  <rect x="166" y="372" width="74" height="22" rx="11" fill="#F5F5F4"/>
  <text x="203" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">ID verified</text>
