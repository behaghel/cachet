  <text x="272" y="387" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">Sales</text>
  <text x="104" y="414" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">4 proofs required</text>
