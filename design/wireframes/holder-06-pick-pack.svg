  <line x1="330" y1="358" x2="340" y2="358" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 336 353 L 341 358 L 336 363" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

