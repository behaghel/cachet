  <line x1="330" y1="494" x2="340" y2="494" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 336 489 L 341 494 L 336 499" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

