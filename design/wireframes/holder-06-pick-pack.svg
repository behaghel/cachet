  <use href="#childcare-shield" x="24" y="184" width="64" height="83"/>
  <text x="104" y="202" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#1C1917">Childcare Ready</text>
  <text x="104" y="222" font-family="Inter, sans-serif" font-size="12" fill="#57534E">Identity, background check, references</text>
  <!-- Predicate chips -->
  <rect x="104" y="236" width="56" height="22" rx="11" fill="#F5F5F4"/>
  <text x="132" y="251" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">Age 18+</text>
  <rect x="166" y="236" width="74" height="22" rx="11" fill="#F5F5F4"/>
  <text x="203" y="251" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">ID verified</text>
  <rect x="246" y="236" width="72" height="22" rx="11" fill="#F5F5F4"/>
  <text x="282" y="251" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#57534E">No record</text>
  <text x="104" y="278" font-family="Inter, sans-serif" font-size="11" fill="#A8A29E">4 proofs required</text>
  <!-- Select arrow -->
  <circle cx="336" cy="224" r="16" fill="#10B981"/>
  <line x1="330" y1="224" x2="340" y2="224" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 336 219 L 341 224 L 336 229" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

