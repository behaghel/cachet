<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    EMPTY VAULT: First time after onboarding.
    No credentials yet. Warm, encouraging, clear CTA.
  -->

  <defs>
    <symbol id="brand-shield" viewBox="0 0 400 480">
      <path d="M 200 32 C 240 55, 348 58, 366 59 V 221 C 366 311, 296 382, 200 418 C 104 382, 34 311, 34 221 V 59 C 52 58, 160 55, 200 32 Z" fill="#34D399"/>
      <path d="M 200 40 C 238 54, 340 63, 362 63 V 219 C 362 307, 294 376, 200 412 C 106 376, 38 307, 38 219 V 63 C 60 63, 162 54, 200 40 Z" fill="#10B981"/>
      <path d="M 200 47 C 234 63, 334 68, 354 71 V 218 C 354 301, 288 367, 200 401 C 112 367, 46 301, 46 218 V 71 C 66 68, 166 63, 200 47 Z" fill="#059669"/>
      <path d="M 200 54 C 230 64, 328 74, 350 73 V 218 C 350 297, 286 363, 200 397 C 114 363, 50 297, 50 218 V 73 C 72 74, 170 64, 200 54 Z" fill="#6EE7B7"/>
      <path d="M 200 62 C 228 71, 322 78, 342 81 V 218 C 342 294, 280 356, 200 388 C 120 356, 58 294, 58 218 V 81 C 78 78, 172 71, 200 62 Z" fill="#1E293B"/>
      <path d="M 200 62 C 172 71, 78 78, 58 81 V 218 C 58 294, 120 356, 200 388 Z" fill="#253347"/>
      <path d="M 200 131 C 280 131, 330 152, 326 257 C 324 320, 268 358, 200 390 Z" fill="#0EA572"/>
      <path d="M 200 131 C 120 131, 70 152, 74 257 C 76 320, 132 358, 200 390 Z" fill="#10B981"/>
      <path d="M 274 308 A 108 108 0 1 0 126 308" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="375" height="812" rx="40" fill="#FAFAF9"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1C1917">9:41</text>
  <circle cx="320" cy="48" r="4" fill="#10B981"/>
  <rect x="332" y="44" width="20" height="8" rx="2" fill="#1C1917"/>

  <!-- Header: mini logo + wordmark -->
  <use href="#brand-shield" x="132" y="78" width="14" height="17"/>
  <text x="198" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#1C1917">Cachet</text>

  <!-- Segmented control — My Cachets active -->
  <rect x="24" y="112" width="327" height="44" rx="22" fill="#F5F5F4"/>
  <rect x="29" y="116" width="166" height="36" rx="18" fill="#1E293B"/>
  <text x="112" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">My Cachets</text>
  <text x="263" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#57534E">Activity</text>

  <!-- Empty state -->

  <!-- Illustration: empty vault with dotted outline card -->
  <rect x="56" y="260" width="263" height="160" rx="20" fill="none" stroke="#E7E5E4" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- Ghost card lines -->
  <rect x="80" y="290" width="120" height="12" rx="6" fill="#F5F5F4"/>
  <rect x="80" y="312" width="180" height="8" rx="4" fill="#F5F5F4"/>
  <rect x="80" y="330" width="60" height="20" rx="10" fill="#F5F5F4"/>
  <rect x="148" y="330" width="60" height="20" rx="10" fill="#F5F5F4"/>
  <!-- Plus icon in center-bottom -->
  <circle cx="188" cy="385" r="18" fill="#F5F5F4"/>
  <text x="188" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" fill="#A8A29E">+</text>

  <!-- Text -->
  <text x="188" y="480" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1C1917">Your vault is empty</text>
  <text x="188" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#57534E">Verify your identity to get your first</text>
  <text x="188" y="530" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#57534E">credential. It takes about 2 minutes.</text>

  <!-- Steps preview -->
  <rect x="40" y="560" width="295" height="112" rx="16" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="1"/>

  <text x="68" y="588" font-family="Inter, sans-serif" font-size="12" fill="#10B981">1</text>
  <circle cx="68" cy="584" r="10" fill="#ECFDF5"/>
  <text x="68" y="588" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#065F46">1</text>
  <text x="88" y="589" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">Take a selfie</text>

  <circle cx="68" cy="616" r="10" fill="#ECFDF5"/>
  <text x="68" y="620" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#065F46">2</text>
  <text x="88" y="621" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">Scan your ID document</text>

  <circle cx="68" cy="648" r="10" fill="#ECFDF5"/>
  <text x="68" y="652" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#065F46">3</text>
  <text x="88" y="653" font-family="Inter, sans-serif" font-size="13" fill="#1C1917">Receive your credential</text>

  <!-- CTA -->
  <rect x="24" y="696" width="327" height="56" rx="28" fill="#10B981"/>
  <text x="188" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Verify My Identity</text>
</svg>