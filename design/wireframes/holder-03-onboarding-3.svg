<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    ONBOARDING 3/3: "Every share, on the record"
    Introduces transparency log concept. Then CTA to get started.
  -->

  <rect width="375" height="812" rx="40" fill="#1E293B"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>

  <!-- Illustration: receipt list with log badges -->
  <rect x="48" y="140" width="280" height="50" rx="12" fill="#334155"/>
  <circle cx="76" cy="165" r="10" fill="#10B981"/>
  <text x="76" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF">✓</text>
  <text x="96" y="162" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">Childcare check — Mar 15</text>
  <text x="96" y="178" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Parents Association</text>
  <text x="298" y="170" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#34D399">Logged</text>

  <rect x="48" y="200" width="280" height="50" rx="12" fill="#334155"/>
  <circle cx="76" cy="225" r="10" fill="#10B981"/>
  <text x="76" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF">✓</text>
  <text x="96" y="222" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">Age verification — Mar 12</text>
  <text x="96" y="238" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Concert venue</text>
  <text x="298" y="230" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#34D399">Logged</text>

  <rect x="48" y="260" width="280" height="50" rx="12" fill="#334155"/>
  <circle cx="76" cy="285" r="10" fill="#F59E0B"/>
  <text x="76" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#FFFFFF">⏳</text>
  <text x="96" y="282" font-family="Inter, sans-serif" font-size="12" fill="#FFFFFF">Seller badge — Mar 10</text>
  <text x="96" y="298" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Marketplace</text>
  <text x="298" y="290" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#F59E0B">Pending</text>

  <!-- Text -->
  <text x="188" y="380" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Every share,</text>
  <text x="188" y="415" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">on the record</text>

  <text x="188" y="458" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">Each time you share a proof, a receipt</text>
  <text x="188" y="478" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">is created and logged publicly.</text>
  <text x="188" y="498" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">You can audit anytime.</text>

  <!-- Key point -->
  <rect x="40" y="530" width="295" height="56" rx="16" fill="#334155"/>
  <text x="64" y="554" font-family="Inter, sans-serif" font-size="20" fill="#10B981">📋</text>
  <text x="92" y="552" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">Nobody can deny what happened.</text>
  <text x="92" y="570" font-family="Inter, sans-serif" font-size="12" fill="#64748B">Tamper-proof transparency log.</text>

  <!-- Pagination dots -->
  <circle cx="172" cy="640" r="4" fill="#64748B"/>
  <circle cx="188" cy="640" r="4" fill="#64748B"/>
  <circle cx="204" cy="640" r="4" fill="#FFFFFF"/>

  <!-- CTA: Get started -->
  <rect x="24" y="690" width="327" height="56" rx="28" fill="#10B981"/>
