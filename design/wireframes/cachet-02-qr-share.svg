<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    SCREEN 2: QR / Share
    After selecting "Safe for my kids?" the verifier sees this screen.
    Shows a QR code to present to the person being verified.
    Social moment — large, confident, clear.
  -->

  <defs>
    <symbol id="brand-shield" viewBox="0 0 400 480">
      <path d="M 200 32 C 240 55, 348 58, 366 59 V 221 C 366 311, 296 382, 200 418 C 104 382, 34 311, 34 221 V 59 C 52 58, 160 55, 200 32 Z" fill="#34D399"/>
      <path d="M 200 40 C 238 54, 340 63, 362 63 V 219 C 362 307, 294 376, 200 412 C 106 376, 38 307, 38 219 V 63 C 60 63, 162 54, 200 40 Z" fill="#10B981"/>
      <path d="M 200 47 C 234 63, 334 68, 354 71 V 218 C 354 301, 288 367, 200 401 C 112 367, 46 301, 46 218 V 71 C 66 68, 166 63, 200 47 Z" fill="#059669"/>
      <path d="M 200 54 C 230 64, 328 74, 350 73 V 218 C 350 297, 286 363, 200 397 C 114 363, 50 297, 50 218 V 73 C 72 74, 170 64, 200 54 Z" fill="#6EE7B7"/>
      <path d="M 200 62 C 228 71, 322 78, 342 81 V 218 C 342 294, 280 356, 200 388 C 120 356, 58 294, 58 218 V 81 C 78 78, 172 71, 200 62 Z" fill="#1E293B"/>
      <path d="M 200 62 C 172 71, 78 78, 58 81 V 218 C 58 294, 120 356, 200 388 Z" fill="#253347"/>
      <path d="M 200 131 C 280 131, 330 152, 326 257 C 324 320, 268 358, 200 390 Z" fill="#0EA572"/>
      <path d="M 200 131 C 120 131, 70 152, 74 257 C 76 320, 132 358, 200 390 Z" fill="#10B981"/>
      <path d="M 274 308 A 108 108 0 1 0 126 308" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
    </symbol>
  </defs>

  <!-- Phone background -->
  <rect width="375" height="812" rx="40" fill="#1E293B"/>

  <!-- Status bar (light text on dark) -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>
  <circle cx="320" cy="48" r="4" fill="#10B981"/>
  <rect x="332" y="44" width="20" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Back arrow + Close -->
  <text x="24" y="95" font-family="Inter, sans-serif" font-size="22" fill="#FFFFFF">&#x2039;</text>
  <text x="350" y="95" font-family="Inter, sans-serif" font-size="16" fill="#A8A29E">&#x2715;</text>

  <!-- Title -->
  <text x="188" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Safe for my kids?</text>
  <text x="188" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#A8A29E">Show this code to the person you want to verify</text>

  <!-- QR code area (white rounded rectangle simulating QR) -->
  <rect x="60" y="160" width="255" height="255" rx="20" fill="#FFFFFF"/>
  <!-- QR pattern simulation -->
  <rect x="82" y="182" width="24" height="24" fill="#1E293B"/>
  <rect x="82" y="210" width="24" height="8" fill="#1E293B"/>
  <rect x="114" y="182" width="8" height="24" fill="#1E293B"/>
  <rect x="130" y="182" width="8" height="8" fill="#1E293B"/>
  <rect x="130" y="198" width="16" height="8" fill="#1E293B"/>
  <rect x="154" y="182" width="24" height="8" fill="#1E293B"/>
  <rect x="186" y="182" width="8" height="16" fill="#1E293B"/>
  <rect x="202" y="182" width="8" height="8" fill="#1E293B"/>
  <rect x="218" y="182" width="8" height="24" fill="#1E293B"/>
  <rect x="234" y="182" width="24" height="8" fill="#1E293B"/>
  <rect x="266" y="182" width="24" height="24" fill="#1E293B"/>
  <rect x="82" y="230" width="8" height="16" fill="#1E293B"/>
  <rect x="98" y="238" width="16" height="8" fill="#1E293B"/>
  <rect x="130" y="230" width="8" height="8" fill="#1E293B"/>
  <rect x="146" y="222" width="24" height="8" fill="#1E293B"/>
  <rect x="178" y="230" width="8" height="16" fill="#1E293B"/>
  <rect x="202" y="222" width="16" height="8" fill="#1E293B"/>
  <rect x="234" y="230" width="8" height="16" fill="#1E293B"/>
  <rect x="266" y="230" width="8" height="8" fill="#1E293B"/>
  <!-- Center: logo mark -->
  <use href="#brand-shield" x="166" y="265" width="44" height="53"/>
  <!-- More QR rows -->
  <rect x="82" y="320" width="24" height="8" fill="#1E293B"/>
  <rect x="114" y="314" width="8" height="16" fill="#1E293B"/>
  <rect x="130" y="320" width="16" height="8" fill="#1E293B"/>
  <rect x="218" y="314" width="8" height="16" fill="#1E293B"/>
  <rect x="242" y="320" width="16" height="8" fill="#1E293B"/>
  <rect x="82" y="350" width="24" height="24" fill="#1E293B"/>
  <rect x="114" y="358" width="8" height="16" fill="#1E293B"/>
  <rect x="130" y="350" width="24" height="8" fill="#1E293B"/>
  <rect x="162" y="366" width="8" height="8" fill="#1E293B"/>
  <rect x="186" y="358" width="16" height="8" fill="#1E293B"/>
  <rect x="218" y="350" width="24" height="8" fill="#1E293B"/>
  <rect x="250" y="358" width="8" height="16" fill="#1E293B"/>
  <rect x="266" y="350" width="24" height="24" fill="#1E293B"/>

  <!-- What will be checked -->
  <text x="188" y="455" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">This will verify:</text>

  <!-- Predicate chips -->
  <rect x="44" y="472" width="80" height="28" rx="14" fill="#334155"/>
  <text x="84" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">Age 18+</text>

  <rect x="132" y="472" width="106" height="28" rx="14" fill="#334155"/>
  <text x="185" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">ID Verified</text>

  <rect x="246" y="472" width="86" height="28" rx="14" fill="#334155"/>
  <text x="289" y="490" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">No record</text>

  <rect x="108" y="508" width="80" height="28" rx="14" fill="#334155"/>
  <text x="148" y="526" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#FFFFFF">2+ refs</text>

  <!-- Waiting state -->
  <text x="188" y="580" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#A8A29E">Waiting for them to scan...</text>
  <!-- Animated dots hint -->
  <circle cx="170" cy="604" r="4" fill="#64748B" opacity="0.4"/>
  <circle cx="186" cy="604" r="4" fill="#64748B" opacity="0.7"/>
  <circle cx="202" cy="604" r="4" fill="#64748B" opacity="1"/>

  <!-- Alternative: Share link -->
  <rect x="80" y="634" width="215" height="48" rx="24" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <text x="188" y="663" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#FFFFFF">Share link instead</text>

  <!-- Expires label -->
  <text x="188" y="710" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748B">Request expires in 4:58</text>
</svg>