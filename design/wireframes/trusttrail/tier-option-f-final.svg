<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 580" width="375" height="580">
  <!--
    OPTION F: Final — C-shaped circular dial with green progress,
    tier graduation marks, logo inside, percentage + tier badge + name below.
    Evidence breakdown: one line per platform with contribution.
    Silver tier, strength 72%.
  -->
  <rect width="375" height="580" fill="#0F172A" rx="24"/>

  <!-- ═══ CIRCULAR DIAL — radius 130, stroke 32 ═══ -->
  <g transform="translate(187, 175)">

    <!-- Background track — full C arc -->
    <path d="M -95 88 A 130 130 0 1 1 95 88"
          fill="none" stroke="#1E293B" stroke-width="32" stroke-linecap="round"/>

    <!-- ═══ GREEN PROGRESS FILL (72%) ═══ -->
    <path d="M -95 88 A 130 130 0 1 1 109 -73"
          fill="none" stroke="#10B981" stroke-width="28" stroke-linecap="round"/>

    <!-- Current position dot -->
    <circle cx="109" cy="-73" r="7" fill="#10B981" stroke="white" stroke-width="2.5"/>

    <!-- Unfilled remainder — faint hint -->
    <path d="M 109 -73 A 130 130 0 0 1 95 88"
          fill="none" stroke="#334155" stroke-width="28" stroke-linecap="round" opacity="0.3"/>

    <!-- ═══ CACHET LOGO INSIDE THE DIAL — scale 0.3 ═══ -->
    <g transform="translate(-60, -78) scale(0.3)">
      <!-- Shield border -->
      <path d="M 200 32 C 240 55, 348 58, 366 59 V 221 C 366 311, 296 382, 200 418 C 104 382, 34 311, 34 221 V 59 C 52 58, 160 55, 200 32 Z" fill="#34D399"/>
      <path d="M 200 40 C 238 54, 340 63, 362 63 V 219 C 362 307, 294 376, 200 412 C 106 376, 38 307, 38 219 V 63 C 60 63, 162 54, 200 40 Z" fill="#10B981"/>
      <path d="M 200 47 C 234 63, 334 68, 354 71 V 218 C 354 301, 288 367, 200 401 C 112 367, 46 301, 46 218 V 71 C 66 68, 166 63, 200 47 Z" fill="#059669"/>
      <path d="M 200 54 C 230 64, 328 74, 350 73 V 218 C 350 297, 286 363, 200 397 C 114 363, 50 297, 50 218 V 73 C 72 74, 170 64, 200 54 Z" fill="#6EE7B7"/>
      <!-- Shield body -->
      <path d="M 200 62 C 228 71, 322 78, 342 81 V 218 C 342 294, 280 356, 200 388 C 120 356, 58 294, 58 218 V 81 C 78 78, 172 71, 200 62 Z" fill="#1E293B"/>
      <path d="M 200 62 C 172 71, 78 78, 58 81 V 218 C 58 294, 120 356, 200 388 Z" fill="#253347"/>
      <!-- Front face -->
      <path d="M 200 131 C 280 131, 330 152, 326 257 C 324 320, 268 358, 200 390 Z" fill="#0EA572"/>
      <path d="M 200 131 C 120 131, 70 152, 74 257 C 76 320, 132 358, 200 390 Z" fill="#10B981"/>
      <!-- White C -->
      <path d="M 274 308 A 108 108 0 1 0 126 308" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ═══ TIER BADGE + PERCENTAGE — inside the dial, below the cachet logo ═══ -->
  <defs>
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="40%" stop-color="#9CA3AF"/>
      <stop offset="60%" stop-color="#D1D5DB"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
  </defs>
  <rect x="131" y="232" width="112" height="30" rx="15" fill="url(#silver-gradient)"/>
  <rect x="133" y="234" width="108" height="26" rx="13" fill="#0F172A"/>
  <text x="187" y="253" text-anchor="middle" fill="url(#silver-gradient)" font-family="system-ui" font-size="13" font-weight="800" letter-spacing="1.5">SILVER</text>

  <text x="187" y="282" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="20" font-weight="600">72%</text>

  <!-- ═══ CACHET NAME — below the dial ═══ -->
  <text x="187" y="330" text-anchor="middle" fill="white" font-family="system-ui" font-size="22" font-weight="bold">Trusted Host</text>

  <!-- ═══ EVIDENCE BREAKDOWN ═══ -->
  <g transform="translate(24, 352)">
    <text x="0" y="16" fill="#94A3B8" font-family="system-ui" font-size="12" font-weight="600">Evidence</text>

    <!-- Platform row: HomeExchange -->
    <rect x="0" y="28" width="327" height="48" rx="10" fill="#1E293B"/>
    <text x="16" y="50" fill="white" font-family="system-ui" font-size="14" font-weight="500">HomeExchange</text>
    <text x="16" y="68" fill="#94A3B8" font-family="system-ui" font-size="11">7 evidence items</text>
    <rect x="210" y="44" width="100" height="6" rx="3" fill="#253347"/>
    <rect x="210" y="44" width="72" height="6" rx="3" fill="#10B981"/>
    <text x="316" y="54" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="end">72%</text>

    <!-- Platform row: Vinted -->
    <rect x="0" y="84" width="327" height="48" rx="10" fill="#1E293B"/>
    <text x="16" y="106" fill="white" font-family="system-ui" font-size="14" font-weight="500">Vinted</text>
    <text x="16" y="124" fill="#94A3B8" font-family="system-ui" font-size="11">3 evidence items</text>
    <rect x="210" y="100" width="100" height="6" rx="3" fill="#253347"/>
    <rect x="210" y="100" width="18" height="6" rx="3" fill="#10B981"/>
    <text x="316" y="110" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="end">18%</text>
  </g>

  <!-- Secondary CTA — outlined SealButton style, pinned to bottom -->
  <rect x="24" y="530" width="327" height="44" rx="22" fill="none" stroke="#10B981" stroke-width="1.5"/>
  <text x="187" y="557" text-anchor="middle" fill="#10B981" font-family="system-ui" font-size="14" font-weight="600">Scan for more evidence to reach Gold</text>
</svg>
