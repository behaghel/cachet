<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <!--
    ONBOARDING 1/4: "Don't take their word for it"
    First screen after install. Demand-side value prop:
    verify others on YOUR terms, don't blindly trust platforms.
  -->

  <defs>
    <symbol id="brand-shield" viewBox="0 0 400 480">
      <path d="M 200 32 C 240 55, 348 58, 366 59 V 221 C 366 311, 296 382, 200 418 C 104 382, 34 311, 34 221 V 59 C 52 58, 160 55, 200 32 Z" fill="#34D399"/>
      <path d="M 200 40 C 238 54, 340 63, 362 63 V 219 C 362 307, 294 376, 200 412 C 106 376, 38 307, 38 219 V 63 C 60 63, 162 54, 200 40 Z" fill="#10B981"/>
      <path d="M 200 47 C 234 63, 334 68, 354 71 V 218 C 354 301, 288 367, 200 401 C 112 367, 46 301, 46 218 V 71 C 66 68, 166 63, 200 47 Z" fill="#059669"/>
      <path d="M 200 54 C 230 64, 328 74, 350 73 V 218 C 350 297, 286 363, 200 397 C 114 363, 50 297, 50 218 V 73 C 72 74, 170 64, 200 54 Z" fill="#6EE7B7"/>
      <path d="M 200 62 C 228 71, 322 78, 342 81 V 218 C 342 294, 280 356, 200 388 C 120 356, 58 294, 58 218 V 81 C 78 78, 172 71, 200 62 Z" fill="#1E293B"/>
      <path d="M 200 62 C 172 71, 78 78, 58 81 V 218 C 58 294, 120 356, 200 388 Z" fill="#253347"/>
      <path d="M 200 131 C 280 131, 330 152, 326 257 C 324 320, 268 358, 200 390 Z" fill="#0EA572"/>
      <path d="M 200 131 C 120 131, 70 152, 74 257 C 76 320, 132 358, 200 390 Z" fill="#10B981"/>
      <path d="M 274 308 A 108 108 0 1 0 126 308" fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="375" height="812" rx="40" fill="#1E293B"/>

  <!-- Status bar -->
  <text x="30" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">9:41</text>

  <!-- Skip -->
  <text x="338" y="95" text-anchor="end" font-family="Inter, sans-serif" font-size="14" fill="#64748B">Skip</text>

  <!-- Illustration: brand shield with magnifying glass overlay -->
  <use href="#brand-shield" x="88" y="140" width="200" height="240"/>

  <!-- Magnifying glass overlaid on lower-right of shield -->
  <g transform="translate(228, 310)">
    <!-- Glass circle -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.95"/>
    <!-- Inner lens highlight -->
    <circle cx="-8" cy="-8" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
    <!-- Handle -->
    <line x1="22" y1="22" x2="48" y2="48" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Text content -->
  <text x="188" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">Don't take their</text>
  <text x="188" y="475" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">word for it</text>

  <text x="188" y="513" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">Buying from a stranger? Hiring a babysitter?</text>
  <text x="188" y="533" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#94A3B8">Demand real proof — not promises.</text>

  <!-- Key point -->
  <rect x="40" y="566" width="295" height="56" rx="16" fill="#334155"/>
  <text x="64" y="590" font-family="Inter, sans-serif" font-size="20" fill="#10B981">&#x1F50D;</text>
  <text x="92" y="588" font-family="Inter, sans-serif" font-size="13" fill="#FFFFFF">You set the rules. They prove it.</text>
  <text x="92" y="606" font-family="Inter, sans-serif" font-size="12" fill="#64748B">No platform middleman needed.</text>

  <!-- Pagination dots (4 dots, first active) -->
  <circle cx="164" cy="650" r="4" fill="#FFFFFF"/>
  <circle cx="180" cy="650" r="4" fill="#64748B"/>
  <circle cx="196" cy="650" r="4" fill="#64748B"/>
  <circle cx="212" cy="650" r="4" fill="#64748B"/>

  <!-- CTA -->
  <rect x="24" y="700" width="327" height="56" rx="28" fill="#10B981"/>
  <text x="188" y="734" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Next</text>
