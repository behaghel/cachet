  <text x="96" y="238" font-family="Inter, sans-serif" font-size="10" fill="#64748B">Concert venue</text>
  <text x="298" y="230" text-anchor="end" font-family="Inter, sans-serif" font-size="9" fill="#34D399">Logged</text>

  <!-- Entry 3: Seller cachet — seller shield (amber) -->
