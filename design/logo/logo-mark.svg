<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <!--
    Cachet logo mark — Shield shape
    Brand colors: Midnight Slate #1E293B + Vivid Emerald #10B981
    Angled shield top (peaks at center, slopes to sides) with beveled border.
    Bold C mark — thick stroke, edges near inner rim.
    All paths symmetric around x=200.
  -->

  <!-- ═══ SHIELD BORDER — beveled 3D effect ═══ -->
  <!-- Outer rim: lightest emerald highlight (top-left bevel) -->
  <path d="M 200 32
           C 240 55, 348 58, 366 59
           V 221
           C 366 311, 296 382, 200 418
           C 104 382, 34 311, 34 221
           V 59
           C 52 58, 160 55, 200 32 Z"
        fill="#34D399"/>

  <!-- Mid rim: emerald -->
  <path d="M 200 40
           C 238 54, 340 63, 362 63
           V 219
           C 362 307, 294 376, 200 412
           C 106 376, 38 307, 38 219
           V 63
           C 60 63, 162 54, 200 40 Z"
        fill="#10B981"/>

  <!-- Inner rim: deep emerald shadow (bottom-right bevel) -->
  <path d="M 200 47
           C 234 63, 334 68, 354 71
           V 218
           C 354 301, 288 367, 200 401
           C 112 367, 46 301, 46 218
           V 71
           C 66 68, 166 63, 200 47 Z"
        fill="#059669"/>

  <!-- Liseré: light emerald accent line -->
  <path d="M 200 54
           C 230 64, 328 74, 350 73
           V 218
           C 350 297, 286 363, 200 397
           C 114 363, 50 297, 50 218
           V 73
           C 72 74, 170 64, 200 54 Z"
        fill="#6EE7B7"/>

  <!-- ═══ SHIELD BODY — dark slate with center fold ═══ -->
  <!-- Base: dark slate -->
  <path d="M 200 62
           C 228 71, 322 78, 342 81
           V 218
           C 342 294, 280 356, 200 388
           C 120 356, 58 294, 58 218
           V 81
           C 78 78, 172 71, 200 62 Z"
        fill="#1E293B" id="shield-body"/>

  <!-- Left half: slightly lighter for center-fold effect -->
  <path d="M 200 62
           C 172 71, 78 78, 58 81
           V 218
           C 58 294, 120 356, 200 388 Z"
        fill="#253347"/>

  <!-- ═══ FRONT FACE — Vivid Emerald ═══ -->
  <!-- Right half (shadow side) -->
  <path d="M 200 131
           C 280 131, 330 152, 326 257
           C 324 320, 268 358, 200 390 Z"
        fill="#0EA572"/>

  <!-- Left half (reflection, brighter) -->
  <path d="M 200 131
           C 120 131, 70 152, 74 257
           C 76 320, 132 358, 200 390 Z"
        fill="#10B981"/>

  <!-- ═══ WHITE C ARC ═══ -->
  <!-- Radius 108, stroke 56, opening at bottom. ~30px top gap, caps ~5px from liseré. -->
  <path d="M 274 308 A 108 108 0 1 0 126 308"
        fill="none" stroke="white" stroke-width="56" stroke-linecap="round"/>
</svg>
