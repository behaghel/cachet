name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  # Backend services using devenv (lightweight)
  backend:
    name: Backend (Go Services)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv
        with:
          cache-prefix: backend
          disk-threshold-gb: 6
          enable-go-cache: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Setup CI secrets
        shell: bash
        run: |
          echo "Setting up dummy secrets for CI..."
          cp .env.ci .env
          echo "✅ Dummy secrets configured for SecretSpec compatibility"

      - name: Run backend CI pipeline
        shell: bash
        run: |
          set -euo pipefail
          devenv shell -- bash -lc '
            set -euo pipefail
            echo "📦 Installing dependencies, running tests, lint, and security scan..."
            ci:deps && ci:test && ci:lint && ci:security
          '
          echo "✅ All backend CI steps completed successfully"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/verifier.out,./coverage/registry.out,./coverage/receipts.out
          flags: backend
          name: cachet-backend-coverage
          fail_ci_if_error: false

  # Android app using devenv (consistent with backend)
  android:
    name: Android App  
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv
        with:
          cache-prefix: android
          disk-threshold-gb: 8
          enable-android-cache: true
          enable-android-sdk: true
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Setup CI secrets
        shell: bash
        run: |
          echo "Setting up dummy secrets for CI..."
          cp .env.ci .env
          echo "✅ Dummy secrets configured for SecretSpec compatibility"

      - name: Build & test Android app
        shell: bash
        run: |
          set -euo pipefail
          devenv shell -- bash -lc '
            set -euo pipefail
            android:build && android:test-unit
          '

  # Schema validation (lightweight, no devenv needed)
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install -g @redocly/cli
          pip install openapi-generator-cli

      - name: Validate OpenAPI schema
        run: redocly lint schemas/openapi.yaml

  # Build devenv containers (consistent with development)
  build:
    name: Build devenv Containers
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv
        with:
          cache-prefix: build
          disk-threshold-gb: 6
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Setup CI secrets
        shell: bash
        run: |
          echo "Setting up dummy secrets for CI..."
          cp .env.ci .env
          echo "✅ Dummy secrets configured for SecretSpec compatibility"

      # Cache container builds
      - name: Cache container builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nix/eval-cache-v5
            ~/.cache/devenv
          key: ${{ runner.os }}-containers-${{ hashFiles('devenv.nix', 'devenv.lock') }}
          restore-keys: |
            ${{ runner.os }}-containers-

      - name: Build verifier container
        shell: bash
        run: devenv container build verifier

      - name: Build registry container
        shell: bash
        run: devenv container build registry

      - name: Build receipts container
        shell: bash
        run: devenv container build receipts

      - name: Build issuance container
        shell: bash
        run: devenv container build issuance

  deploy:
    name: Deploy to GCP
    runs-on: ubuntu-latest
    needs: [backend, build]
    if: ${{ github.ref == 'refs/heads/main' && !failure() && !cancelled() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup devenv environment
        uses: ./.github/actions/setup-devenv
        with:
          cache-prefix: deploy
          disk-threshold-gb: 6
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Setup production secrets with SecretSpec
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}
        run: |
          echo "Setting up production secrets via SecretSpec environment provider..."
          cp .env.ci .env
          
          echo "=== DEBUG: Environment Variables ==="
          echo "GCP_SA_KEY length: ${#GCP_SA_KEY}"
          echo "CACHIX_AUTH_TOKEN length: ${#CACHIX_AUTH_TOKEN}"
          echo "CACHIX_AUTH_TOKEN: ${CACHIX_AUTH_TOKEN:-'(empty)'}"
          echo "=== END DEBUG ==="
          
          echo "✅ Secrets configured for SecretSpec consistency"

      - name: Authenticate to Google Cloud via SecretSpec
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}
        run: |
          devenv shell -- bash -lc '
            set -euo pipefail
            export SECRETSPEC_PROVIDER=env://
            export SECRETSPEC_PROFILE=ci

            secretspec run -- bash scripts/ci/gcp-auth.sh
          '

      - name: Deploy issuance gateway to Cloud Run via SecretSpec
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}
        run: |
          devenv shell -- bash -lc '
            set -euo pipefail
            export SECRETSPEC_PROVIDER=env://
            export SECRETSPEC_PROFILE=ci

            secretspec run -- bash scripts/ci/gcp-auth.sh
            secretspec run -- gcp:deploy:issuance-gateway
          '

      - name: Update deployment status
        shell: bash
        run: |
          echo "✅ Deployment completed successfully"
          devenv shell -- gcp:status
