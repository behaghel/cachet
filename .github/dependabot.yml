version: 2
updates:
  # Go dependencies — one PR per weekly batch across all modules
  - package-ecosystem: "gomod"
    directories:
      - "/services/admin"
      - "/services/common"
      - "/services/issuance-gateway"
      - "/services/receipts-log"
      - "/services/registry"
      - "/services/relay"
      - "/services/verifier"
      - "/generated/go"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  # Gradle dependencies (Android) — grouped by ecosystem for coherent PRs
  - package-ecosystem: "gradle"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      kotlin-ecosystem:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      ktor:
        patterns: ["io.ktor*"]
      sqldelight:
        patterns: ["app.cash.sqldelight*"]
      androidx:
        patterns: ["androidx.*"]
      mobile-other:
        patterns: ["*"]
        exclude-patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "io.ktor*", "app.cash.sqldelight*", "androidx.*"]

  # Docker base images — single Dockerfile in /infra
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]

  # GitHub Actions — grouped into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      ci-actions:
        patterns: ["*"]
