version: 2
updates:
  # Go dependencies — grouped so one PR covers all modules
  - package-ecosystem: "gomod"
    directory: "/services/common"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/verifier"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/registry"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/receipts-log"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/services/issuance-gateway"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/generated/go"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-deps:
        patterns: ["*"]

  # Gradle dependencies (Android) — grouped, major bumps separate
  - package-ecosystem: "gradle"
    directory: "/mobile"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      mobile-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      mobile-major:
        patterns: ["*"]
        update-types: ["major"]

  # Docker base images — grouped into one PR
  - package-ecosystem: "docker"
    directory: "/services/verifier"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/services/registry"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/services/receipts-log"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/services/issuance-gateway"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker)"
    groups:
      docker-base:
        patterns: ["*"]

  # GitHub Actions — grouped into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      ci-actions:
        patterns: ["*"]
