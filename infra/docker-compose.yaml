services:
  verifier:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: verifier
    ports: ["8081:8080"]
    environment:
      CACHET_REGISTRY_URL: http://registry:8080
      CACHET_ISSUANCE_URL: http://issuance-gateway:8080
      CACHET_VERIFIER_DID: "did:web:verifier.cachet.id"
    depends_on:
      - registry
      - issuance-gateway

  registry:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: registry
    ports: ["8082:8080"]

  receipts:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: receipts-log
    ports: ["8083:8080"]

  issuance-gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: issuance-gateway
    ports: ["8090:8080"]
    environment:
      VERIFF_WEBHOOK_SECRET: dev-secret-do-not-use-in-production

  relay:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: relay
    ports: ["8084:8080"]

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        SERVICE: admin
    ports: ["8091:8080"]
    environment:
      ADMIN_API_KEY: dev-admin-key
      CACHET_REGISTRY_URL: http://registry:8080
      CACHET_ISSUANCE_URL: http://issuance-gateway:8080
      CACHET_RELAY_URL: http://relay:8080
      CACHET_VERIFIER_URL: http://verifier:8080
    depends_on:
      - registry
      - issuance-gateway
      - relay
      - verifier
